apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: vf-intern-webapp-for-containers
  title: Azure Web App for Containers デプロイ (vf-intern)
  description: |
    vf-intern-arm-template を使って Azure Web App for Containers をARMテンプレートでデプロイします。
    Linux App Service Plan と Node-RED コンテナ実行環境が作成されます。
  tags:
    - azure
    - arm
    - webapp
    - containers
    - node-red
  links:
    - url: https://github.com/tkeydll/vf-intern-arm-template/tree/master/webapp_for_containers
      title: テンプレートのソース
      icon: github
spec:
  owner: user:guest
  type: infrastructure

  parameters:
    - title: Azureリソースの設定
      required:
        - subscriptionId
        - resourceGroupName
        - location
        - appName
      properties:
        subscriptionId:
          title: サブスクリプションID
          type: string
          description: AzureサブスクリプションのID
        resourceGroupName:
          title: リソースグループ名
          type: string
          description: デプロイ先のリソースグループ名（存在しない場合は自動作成）
          pattern: '^[a-zA-Z0-9._\-()]+$'
        location:
          title: リージョン
          type: string
          description: Azureのデプロイ先リージョン
          default: japaneast
          enum:
            - japaneast
            - japanwest
            - eastus
            - westus2
            - westeurope
          enumNames:
            - 'Japan East（東日本）'
            - 'Japan West（西日本）'
            - 'East US（米国東部）'
            - 'West US 2（米国西部2）'
            - 'West Europe（西ヨーロッパ）'
        appName:
          title: アプリ名
          type: string
          description: Web App の名前（グローバルで一意にしてね！）
          pattern: '^[a-z0-9-]+$'
          default: vf-intern-nodered

  steps:
    - id: deploy-arm
      name: ARM テンプレートをデプロイ
      action: azure:arm:deploy
      input:
        subscriptionId: ${{ parameters.subscriptionId }}
        resourceGroupName: ${{ parameters.resourceGroupName }}
        location: ${{ parameters.location }}
        deploymentName: backstage-webapp-${{ parameters.appName }}
        template:
          $schema: 'https://schema.management.azure.com/schemas/2015-01-01/deploymentTemplate.json#'
          contentVersion: '1.0.0.0'
          parameters:
            appName:
              type: String
            config_web_name:
              defaultValue: web
              type: String
            location:
              type: string
              defaultValue: '[resourceGroup().location]'
          variables:
            containerAppName: '[parameters(''appName'')]'
            hostingPlanName: '[concat(parameters(''appName''), ''-plan'')]'
          resources:
            - type: Microsoft.Web/serverfarms
              sku:
                name: B1
                tier: Basic
                size: B1
                family: B
                capacity: 1
              kind: linux
              name: '[variables(''hostingPlanName'')]'
              apiVersion: '2016-09-01'
              location: '[parameters(''location'')]'
              properties:
                name: '[variables(''hostingPlanName'')]'
                reserved: true
                targetWorkerCount: 0
                targetWorkerSizeId: 0
            - type: Microsoft.Web/sites
              kind: 'app,linux,container'
              name: '[parameters(''appName'')]'
              apiVersion: '2016-08-01'
              location: '[parameters(''location'')]'
              dependsOn:
                - '[resourceId(''Microsoft.Web/serverfarms'', variables(''hostingPlanName''))]'
              properties:
                serverFarmId: '[resourceId(''Microsoft.Web/serverfarms'', variables(''hostingPlanName''))]'
                reserved: true
            - type: Microsoft.Web/sites/config
              name: '[concat(parameters(''appName''), ''/'', parameters(''config_web_name''))]'
              apiVersion: '2016-08-01'
              location: '[parameters(''location'')]'
              dependsOn:
                - '[resourceId(''Microsoft.Web/sites'', parameters(''appName''))]'
              properties:
                linuxFxVersion: 'DOCKER|nodered/node-red-docker:latest'
                numberOfWorkers: 1
        parameters:
          appName:
            value: ${{ parameters.appName }}
          location:
            value: ${{ parameters.location }}

  output:
    text:
      - title: デプロイ結果
        content: |
          ## Azure Web App for Containers デプロイ完了！🎉

          - **アプリ名**: ${{ parameters.appName }}
          - **リソースグループ**: ${{ parameters.resourceGroupName }}
          - **リージョン**: ${{ parameters.location }}
          - **デプロイ状態**: ${{ steps['deploy-arm'].output.provisioningState }}
          
          Node-RED は以下のURLでアクセスできます（起動まで少し時間がかかるよ！）:
          `https://${{ parameters.appName }}.azurewebsites.net`
    links:
      - title: Azure Portal でリソースグループを確認
        url: https://portal.azure.com/#resource/subscriptions/${{ parameters.subscriptionId }}/resourceGroups/${{ parameters.resourceGroupName }}/overview
        icon: dashboard
      - title: Web App を開く
        url: https://${{ parameters.appName }}.azurewebsites.net
        icon: web
