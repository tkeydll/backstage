apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description }}
  annotations:
    backstage.io/techdocs-ref: dir:.
    azure.com/subscription-id: ${{ values.subscriptionId }}
    azure.com/resource-group: ${{ values.resourceGroupName }}
    azure.com/web-app-name: ${{ values.name }}
  tags:
    - azure
    - web-app
    - app-service
  links:
    - url: https://${{ values.name }}.azurewebsites.net
      title: Web App URL
      icon: web
    - url: https://portal.azure.com/#@/resource/subscriptions/${{ values.subscriptionId }}/resourceGroups/${{ values.resourceGroupName }}/providers/Microsoft.Web/sites/${{ values.name }}
      title: Azure Portal
      icon: dashboard
spec:
  type: azure-resource
  owner: ${{ values.owner }}
  lifecycle: production
  providesApis: []
  consumesApis: []
  dependsOn: []